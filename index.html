  <style>
    :root {
      --ink:    #1C1008;
      --brown:  #5C3A2E;
      --rose:   #C4847A;
      --petal:  #F2DDD5;
      --cream:  #FAF5EE;
      --warm:   #FFF9F3;
      --gold:   #C9A055;
      --sand:   #EDE0CE;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 16px; }

    body {
      font-family: 'Jost', system-ui, -apple-system, sans-serif;
      font-weight: 300;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      line-height: 1.65;
    }

    /* Trama textil de fondo, muy tenue */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(45deg,  var(--sand) 0 1px, transparent 1px 14px),
        repeating-linear-gradient(-45deg, var(--sand) 0 1px, transparent 1px 14px);
      opacity: .35;
      pointer-events: none;
    }

    main {
      position: relative;
      width: 100%;
      max-width: 34rem;
      background: var(--warm);
      border: 1px solid var(--petal);
      border-radius: 2px;
      padding: clamp(2.25rem, 6vw, 3.5rem);
      text-align: center;
      box-shadow: 0 1px 2px rgba(28,16,8,.04), 0 12px 40px -12px rgba(92,58,46,.18);
    }

    .marca {
      font-family: 'Italiana', Georgia, serif;
      font-size: clamp(1.75rem, 6vw, 2.35rem);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--brown);
    }

    .hilo {
      width: 3.5rem;
      height: 1px;
      margin: 1.5rem auto;
      background: var(--gold);
    }

    h1 {
      font-family: 'Italiana', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.35rem, 4.5vw, 1.7rem);
      line-height: 1.3;
      color: var(--ink);
    }

    p {
      margin-top: 1.1rem;
      font-size: 1rem;
      color: var(--brown);
    }

    .firma {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--rose);
      margin-top: 1.75rem;
    }

    .contacto {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 2rem;
      padding: .85rem 1.75rem;
      font-size: .95rem;
      font-weight: 400;
      letter-spacing: .04em;
      color: var(--warm);
      background: var(--brown);
      border-radius: 2px;
      text-decoration: none;
      transition: background .25s ease, transform .25s ease;
    }

    .contacto:hover,
    .contacto:focus-visible {
      background: var(--ink);
      transform: translateY(-1px);
    }

    .contacto:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .contacto svg { width: 1.15em; height: 1.15em; fill: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .contacto { transition: none; }
      .contacto:hover { transform: none; }
    }
  </style>
</head>

</body>
