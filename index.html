<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finucrochet — Sitio no disponible</title>

  <!-- Se solicita a los buscadores no indexar este aviso -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="description" content="Este sitio ya no se encuentra disponible.">
  <link rel="canonical" href="https://www.finucrochet.com/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.finucrochet.com/">
  <meta property="og:title" content="Finucrochet — Sitio no disponible">
  <meta property="og:description" content="Este sitio ya no se encuentra disponible.">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:    #1C1008;
      --brown:  #5C3A2E;
      --rose:   #C4847A;
      --petal:  #F2DDD5;
      --cream:  #FAF5EE;
      --warm:   #FFF9F3;
      --gold:   #C9A055;
      --sand:   #EDE0CE;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { font-size: 16px; }

    body {
      font-family: 'Jost', system-ui, -apple-system, sans-serif;
      font-weight: 300;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      line-height: 1.65;
    }

    /* Trama textil de fondo, muy tenue */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(45deg,  var(--sand) 0 1px, transparent 1px 14px),
        repeating-linear-gradient(-45deg, var(--sand) 0 1px, transparent 1px 14px);
      opacity: .35;
      pointer-events: none;
    }

    main {
      position: relative;
      width: 100%;
      max-width: 34rem;
      background: var(--warm);
      border: 1px solid var(--petal);
      border-radius: 2px;
      padding: clamp(2.5rem, 7vw, 4rem) clamp(2.25rem, 6vw, 3.5rem);
      text-align: center;
      box-shadow: 0 1px 2px rgba(28,16,8,.04), 0 12px 40px -12px rgba(92,58,46,.18);
    }

    .marca {
      font-family: 'Italiana', Georgia, serif;
      font-size: clamp(1.75rem, 6vw, 2.35rem);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--brown);
    }

    .hilo {
      width: 3.5rem;
      height: 1px;
      margin: 1.5rem auto;
      background: var(--gold);
    }

    h1 {
      font-family: 'Italiana', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.35rem, 4.5vw, 1.7rem);
      line-height: 1.3;
      color: var(--ink);
    }

    p.mensaje {
      margin-top: 1.25rem;
      font-size: 1rem;
      color: var(--brown);
      max-width: 26rem;
      margin-left: auto;
      margin-right: auto;
    }

    .firma {
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      color: var(--rose);
      margin-top: 2.25rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="marca">Finucrochet</p>

    <div class="hilo" role="presentation"></div>

    <h1>Este sitio ya no se<br>encuentra disponible</h1>

    <p class="mensaje">Agradecemos el interés y la confianza de quienes nos acompañaron durante este tiempo.</p>

    <p class="firma">Con gratitud</p>
  </main>
</body>
</html>
